name: Publish audited installer to npm latest

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Verify only, or publish 1.0.14 directly to npm latest
        required: true
        default: verify
        type: choice
        options:
          - verify
          - publish-latest
      confirmation:
        description: Type publish-1.0.14-to-latest for the publication operation
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: 1.0.14
  RELEASE_TAG: v1.0.14
  RELEASE_SHA256: 6f91b7b9c13036186e8818535bb4aa7ed2bf618c586376f41d891807ece1b8bd
  PREVIOUS_LATEST: 1.0.6

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Check out audited source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Test the public installer
        run: npm test

      - name: Verify production release contract and keyring
        run: npm run release:preflight

      - name: Verify exact local tarball
        run: node scripts/verify-local-release.mjs --version "$RELEASE_VERSION" --sha256 "$RELEASE_SHA256"

  publish-latest:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-latest'
    needs: verify
    runs-on: macos-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require exact operator confirmation
        shell: bash
        run: test "${{ inputs.confirmation }}" = "publish-1.0.14-to-latest"

      - name: Check out audited source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require the immutable audited tag
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$(git show "$RELEASE_TAG:package.json" | jq -r .version)" = "$RELEASE_VERSION"
          test "$(git show "$RELEASE_TAG:CHECKSUMS.sha256")" = "$RELEASE_SHA256  visualstandard-install-$RELEASE_VERSION.tgz"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install --global npm@11.16.0

      - name: Verify exact local tarball again
        run: node scripts/verify-local-release.mjs --version "$RELEASE_VERSION" --sha256 "$RELEASE_SHA256"

      - name: Prove version is unused and latest has not moved
        run: |
          node scripts/verify-registry-release.mjs \
            --version "$RELEASE_VERSION" \
            --sha256 "$RELEASE_SHA256" \
            --expect-version absent \
            --expect-tag "latest=$PREVIOUS_LATEST"

      - name: Publish immutable version directly to latest with OIDC provenance
        run: npm publish --access public --tag latest --provenance

      - name: Verify published registry bytes and latest
        run: |
          node scripts/verify-registry-release.mjs \
            --version "$RELEASE_VERSION" \
            --sha256 "$RELEASE_SHA256" \
            --expect-version present \
            --expect-tag "latest=$RELEASE_VERSION"
