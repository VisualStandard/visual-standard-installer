name: Stage audited installer for smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Verify only, or publish 1.0.12 to the non-default smoke tag
        required: true
        default: verify
        type: choice
        options:
          - verify
          - stage-smoke
      confirmation:
        description: Type stage-1.0.12-as-smoke for the staging operation
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: 1.0.12
  RELEASE_TAG: v1.0.12
  RELEASE_COMMIT: 78d8493a5b6d3629607cbbe801c5ed39e618415d
  RELEASE_SHA256: 077b6b9ef3ac8156c29d3537178ac354f5a86106d5bda948f0b6c6222aa501c7
  SMOKE_TAG: smoke

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Check out audited source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Test the public installer
        run: npm test

      - name: Verify production release contract and keyring
        run: npm run release:preflight

      - name: Verify immutable release tag
        shell: bash
        run: |
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_COMMIT"
          test "$(git show "$RELEASE_TAG:package.json" | jq -r .version)" = "$RELEASE_VERSION"
          test "$(git show "$RELEASE_TAG:CHECKSUMS.sha256")" = "$RELEASE_SHA256  visualstandard-install-$RELEASE_VERSION.tgz"

      - name: Verify exact local tarball
        run: node scripts/verify-local-release.mjs --version "$RELEASE_VERSION" --sha256 "$RELEASE_SHA256"

  stage-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'stage-smoke'
    needs: verify
    runs-on: macos-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require exact operator confirmation
        shell: bash
        run: test "${{ inputs.confirmation }}" = "stage-1.0.12-as-smoke"

      - name: Check out audited source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install --global npm@11.16.0

      - name: Verify exact local tarball again
        run: node scripts/verify-local-release.mjs --version "$RELEASE_VERSION" --sha256 "$RELEASE_SHA256"

      - name: Prove version and smoke tag are unused
        id: registry-before
        shell: bash
        run: |
          STATE_FILE="$RUNNER_TEMP/registry-before.json"
          node scripts/verify-registry-release.mjs \
            --version "$RELEASE_VERSION" \
            --sha256 "$RELEASE_SHA256" \
            --expect-version absent \
            --expect-tag-absent "$SMOKE_TAG" > "$STATE_FILE"
          LATEST_BEFORE="$(jq -r '.distTags.latest // empty' "$STATE_FILE")"
          test -n "$LATEST_BEFORE"
          echo "latest_before=$LATEST_BEFORE" >> "$GITHUB_OUTPUT"

      - name: Publish immutable version to smoke only
        run: npm publish --access public --tag "$SMOKE_TAG" --provenance

      - name: Verify staged registry bytes and unchanged latest
        run: |
          node scripts/verify-registry-release.mjs \
            --version "$RELEASE_VERSION" \
            --sha256 "$RELEASE_SHA256" \
            --expect-version present \
            --expect-tag "$SMOKE_TAG=$RELEASE_VERSION" \
            --expect-tag "latest=${{ steps.registry-before.outputs.latest_before }}"
