name: Publish audited installer

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag for a protected non-default release
        required: true
        default: test
        type: choice
        options:
          - test
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-latest
    environment: npm
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install --global npm@11.16.0

      - name: Report release toolchain
        run: |
          node --version
          npm --version

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"

      - name: Verify manual release stays on the TEST channel
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: test "${{ inputs.npm_tag }}" = "test"

      - name: Test the public installer
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run --force

      - name: Publish production release with provenance
        if: github.event_name == 'release'
        run: npm publish --access public --tag latest --provenance

      - name: Publish TEST release with provenance
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --access public --tag "${{ inputs.npm_tag }}" --provenance
